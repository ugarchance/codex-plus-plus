name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install patch dependencies
        run: npm --prefix patch ci

      - name: Syntax check JS files
        run: |
          find patch hub tools -type f \( -name "*.mjs" -o -name "*.cjs" \) -not -path "*/node_modules/*" -print0 | xargs -0 -n 1 node --check

      - name: Test apply.mjs --help (expect exit code 0)
        run: node patch/apply.mjs --help

      - name: Test apply.mjs --bogus-arg (expect non-zero exit code)
        run: |
          if node patch/apply.mjs --bogus-arg; then
            echo "Expected node patch/apply.mjs --bogus-arg to fail, but it succeeded."
            exit 1
          else
            echo "apply.mjs correctly rejected bogus argument."
          fi
